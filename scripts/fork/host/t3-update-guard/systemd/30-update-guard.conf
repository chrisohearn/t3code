# t3-update-guard: start only verified fork builds, prove health, roll back failed starts.
# Overrides the ExecStart that `t3 service install` / `t3 update` write, so an upstream
# install cannot crash-loop the service. See ~/.local/libexec/t3-update-guard/guard.
[Unit]
OnFailure=t3-update-guard-rollback.service

[Service]
Environment=T3CODE_RELEASE_BASE_URL=https://github.com/chrisohearn/t3code/releases/download
ExecStart=
ExecStart=%h/.local/libexec/t3-update-guard/guard launch
ExecStartPost=-%h/.local/libexec/t3-update-guard/guard prove-later
